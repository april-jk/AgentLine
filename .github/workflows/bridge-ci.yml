name: Bridge CI

on:
  push:
    tags:
      - "bridge-v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_enabled: ${{ steps.resolve.outputs.release_enabled }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ] && [ -n "${{ inputs.release_version }}" ]; then
            echo "release_enabled=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "release_version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/bridge-v* ]]; then
            echo "release_enabled=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_version=${GITHUB_REF_NAME#bridge-v}" >> "$GITHUB_OUTPUT"
          else
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "release_version=dev" >> "$GITHUB_OUTPUT"
          fi

  build-bridge:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            binary: device-bridge-darwin-arm64
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            binary: device-bridge-darwin-amd64
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            binary: device-bridge-linux-amd64
          - goos: linux
            goarch: arm64
            runner: ubuntu-22.04-arm
            binary: device-bridge-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/device-bridge/go.mod
          cache-dependency-path: packages/device-bridge/go.sum

      - name: Build binary
        working-directory: packages/device-bridge
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BRIDGE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          if [ "${{ matrix.goos }}" = "darwin" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            export CC="clang -arch x86_64"
          fi

          go build -ldflags="-s -w -X main.bridgeVersion=${BRIDGE_VERSION}" \
            -o "${{ matrix.binary }}" ./cmd/bridge/

      - name: Verify binary
        working-directory: packages/device-bridge
        run: |
          file "${{ matrix.binary }}"
          ls -lh "${{ matrix.binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: packages/device-bridge/${{ matrix.binary }}

  build-apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: packages/android-device-server
        run: ./build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentline-device-server-apk
          path: packages/android-device-server/app/build/outputs/apk/release/agentline-device-server.apk

  release:
    if: always() && needs.prepare.outputs.release_enabled == 'true' && needs['build-bridge'].result == 'success' && needs['build-apk'].result == 'success'
    needs:
      - prepare
      - build-bridge
      - build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Ensure release tag exists
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.release_tag }}"
          if git rev-parse --verify "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "${GITHUB_SHA}"
            git push origin "$TAG"
          fi

      - name: Generate checksums
        working-directory: binaries
        run: |
          sha256sum device-bridge-* agentline-device-server.apk > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: Device Bridge v${{ needs.prepare.outputs.release_version }}
          body: |
            ## Device Bridge v${{ needs.prepare.outputs.release_version }}

            - Version: `${{ needs.prepare.outputs.release_version }}`
            - Tag: `${{ needs.prepare.outputs.release_tag }}`
            - Commit: `${{ github.sha }}`

            Pre-built sidecar binaries and Android device server APK for device streaming.

            | Platform | Binary |
            |----------|--------|
            | macOS (Apple Silicon) | `device-bridge-darwin-arm64` |
            | macOS (Intel) | `device-bridge-darwin-amd64` |
            | Linux x86_64 | `device-bridge-linux-amd64` |
            | Linux ARM64 | `device-bridge-linux-arm64` |

            Android server APK:
            - `agentline-device-server.apk`

            After downloading, make bridge binaries executable: `chmod +x device-bridge-*`
          files: |
            binaries/device-bridge-*
            binaries/agentline-device-server.apk
            binaries/checksums-sha256.txt
          draft: false
          prerelease: false
