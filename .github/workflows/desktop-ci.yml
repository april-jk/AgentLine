name: Desktop CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_enabled: ${{ steps.resolve.outputs.release_enabled }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ] && [ -n "${{ inputs.release_version }}" ]; then
            echo "release_enabled=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "release_version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            echo "release_enabled=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
          else
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "release_version=dev" >> "$GITHUB_OUTPUT"
          fi

  build-tauri:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
            target_triple: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
            target_triple: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
            target_triple: ""
          - platform: ubuntu-22.04-arm
            args: ""
            rust_target: ""
            target_triple: ""
          - platform: windows-latest
            args: ""
            rust_target: ""
            target_triple: ""
    runs-on: ${{ matrix.platform }}
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_MACOS_NOTARIZATION: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/desktop/src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xdg-utils

      - name: Set up macOS code signing keychain
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      - name: Set up macOS notarization credentials
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_NOTARIZATION == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Set signing env vars
        shell: bash
        run: |
          if [ "${{ env.HAS_UPDATER_KEY }}" = "true" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ "${{ env.HAS_MACOS_SIGNING }}" = "true" ] && [ "${{ matrix.platform }}" = "macos-latest" ]; then
            echo "APPLE_CERTIFICATE<<CERT_EOF" >> "$GITHUB_ENV"
            echo "${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}" >> "$GITHUB_ENV"
            echo "CERT_EOF" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.MACOS_SIGNING_IDENTITY }}" ]; then
              echo "APPLE_SIGNING_IDENTITY=${{ secrets.MACOS_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
            fi
          fi
          if [ "${{ env.HAS_MACOS_NOTARIZATION }}" = "true" ] && [ "${{ matrix.platform }}" = "macos-latest" ]; then
            echo "APPLE_API_KEY=${{ secrets.ASC_API_KEY_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=${{ secrets.ASC_API_ISSUER_ID }}" >> "$GITHUB_ENV"
          fi
          if [ "${{ env.HAS_WINDOWS_SIGNING }}" = "true" ] && [ -n "${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}" ] && [ -n "${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}" ]; then
            echo "WINDOWS_SIGNING_ACCOUNT=${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}" >> "$GITHUB_ENV"
            echo "WINDOWS_SIGNING_PROFILE=${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}" >> "$GITHUB_ENV"
          fi

      - name: Install trusted-signing-cli
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        run: cargo install trusted-signing-cli

      - name: Install frontend dependencies
        run: pnpm install --ignore-scripts

      - name: Extract changelog
        id: changelog
        if: needs.prepare.outputs.release_enabled == 'true'
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.release_version }}"
          NOTES=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" packages/desktop/CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: ${{ matrix.target_triple }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: packages/desktop
          tauriScript: pnpm tauri
          tagName: ${{ needs.prepare.outputs.release_enabled == 'true' && needs.prepare.outputs.release_tag || '' }}
          releaseName: ${{ needs.prepare.outputs.release_enabled == 'true' && format('AgentLine Desktop v{0}', needs.prepare.outputs.release_version) || '' }}
          releaseBody: ${{ steps.changelog.outputs.notes || 'See the assets to download and install this version.' }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ needs.prepare.outputs.release_enabled == 'true' }}
          updaterJsonKeepUniversal: true
          args: >-
            ${{ matrix.args }}
            ${{ runner.os == 'Linux' && '--bundles deb,rpm' || '' }}
            ${{ env.HAS_UPDATER_KEY == 'true' && '--config ''{"bundle":{"createUpdaterArtifacts":"v2"}}''' || '' }}
            ${{ matrix.platform == 'windows-latest' && env.WINDOWS_SIGNING_ACCOUNT != '' && env.WINDOWS_SIGNING_PROFILE != '' && format('--config ''{{"bundle":{{"windows":{{"signCommand":"trusted-signing-cli -e https://eus.codesigning.azure.net -a {0} -c {1} %1"}}}}}}''', env.WINDOWS_SIGNING_ACCOUNT, env.WINDOWS_SIGNING_PROFILE) || '' }}

      - name: Check for flaky DMG bundling failure
        if: failure() && matrix.platform == 'macos-latest'
        run: |
          echo ""
          echo "::error::macOS DMG bundling failed. This is likely the known flaky hdiutil issue on GitHub Actions runners (not a code problem). Re-run this job: gh run rerun ${{ github.run_id }} --failed"
          echo ""

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd packages/desktop
          PROJECT_DIR="$(pwd)"
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          BUN_BIN="$PROJECT_DIR/src-tauri/binaries/bun-${TRIPLE}"

          cp "$BUN_BIN" /tmp/bun-real
          cp /usr/bin/true "$BUN_BIN"

          pnpm tauri build --bundles appimage

          APPIMAGE=$(find "$PROJECT_DIR/src-tauri/target/release/bundle/appimage" -name '*.AppImage' -type f | head -1)
          echo "Built AppImage: $APPIMAGE ($(stat -c%s "$APPIMAGE") bytes)"

          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          "$APPIMAGE" --appimage-extract
          cp /tmp/bun-real squashfs-root/usr/bin/bun
          chmod +x squashfs-root/usr/bin/bun

          ARCH_NAME=$(uname -m)
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH_NAME}.AppImage" -o appimagetool
          chmod +x appimagetool
          ARCH="$ARCH_NAME" ./appimagetool squashfs-root/ "$APPIMAGE"
          echo "Final AppImage: $APPIMAGE ($(stat -c%s "$APPIMAGE") bytes with real bun)"

          cp /tmp/bun-real "$BUN_BIN"

      - name: Upload Linux AppImage to release
        if: runner.os == 'Linux' && needs.prepare.outputs.release_enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(find packages/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f | head -1)
          echo "Uploading: $APPIMAGE"
          gh release upload "${{ needs.prepare.outputs.release_tag }}" "$APPIMAGE" --clobber

      - name: Clean up macOS keychain
        if: matrix.platform == 'macos-latest' && always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true

  finalize-release:
    if: always() && needs.prepare.outputs.release_enabled == 'true' && needs['build-tauri'].result == 'success'
    needs:
      - prepare
      - build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove .sig files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.release_tag }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep '\.sig$' | while read -r name; do
            echo "Deleting $name"
            gh release delete-asset "$TAG" "$name" --yes
          done || true

      - name: Update release body with download table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.release_tag }}"
          VERSION="${{ needs.prepare.outputs.release_version }}"
          REPO="${GITHUB_REPOSITORY}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          CHANGELOG=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" packages/desktop/CHANGELOG.md)

          {
            echo "## AgentLine Desktop v${VERSION}"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Tag: \`${TAG}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
            fi
            echo "## Download"
            echo ""
            echo "| Platform | |"
            echo "|----------|-|"
            echo "| macOS (Apple Silicon) | [.dmg](${BASE}/AgentLine_${VERSION}_aarch64.dmg) |"
            echo "| macOS (Intel) | [.dmg](${BASE}/AgentLine_${VERSION}_x64.dmg) |"
            echo "| Windows | [.exe](${BASE}/AgentLine_${VERSION}_x64-setup.exe) · [.msi](${BASE}/AgentLine_${VERSION}_x64_en-US.msi) |"
            echo "| Linux x86_64 | [.AppImage](${BASE}/AgentLine_${VERSION}_amd64.AppImage) · [.deb](${BASE}/AgentLine_${VERSION}_amd64.deb) · [.rpm](${BASE}/AgentLine-${VERSION}-1.x86_64.rpm) |"
            echo "| Linux ARM64 | [.AppImage](${BASE}/AgentLine_${VERSION}_aarch64.AppImage) · [.deb](${BASE}/AgentLine_${VERSION}_arm64.deb) · [.rpm](${BASE}/AgentLine-${VERSION}-1.aarch64.rpm) |"
          } > /tmp/release-body.md

          gh release edit "$TAG" --notes-file /tmp/release-body.md
