name: Desktop Electron CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_version:
        required: true
        type: string
      create_release:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      create_release: ${{ steps.resolve.outputs.create_release }}
      release_enabled: ${{ steps.resolve.outputs.release_enabled }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ] && [ -n "${{ inputs.release_version }}" ]; then
            echo "release_enabled=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "release_version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
            echo "create_release=${{ inputs.create_release }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/desktop-electron-v* ]]; then
            echo "release_enabled=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_version=${GITHUB_REF_NAME#desktop-electron-v}" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_enabled=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "release_version=dev" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            command: pnpm --filter @agentline/desktop-electron dist:mac
            artifact: desktop-electron-macos
          - runner: windows-latest
            command: pnpm --filter @agentline/desktop-electron dist:win
            artifact: desktop-electron-windows
          - runner: ubuntu-latest
            command: pnpm --filter @agentline/desktop-electron dist:linux
            artifact: desktop-electron-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck desktop electron
        run: pnpm --filter @agentline/desktop-electron typecheck

      - name: Build desktop electron binaries
        run: ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/desktop-electron/release/*.dmg
            packages/desktop-electron/release/*.zip
            packages/desktop-electron/release/*.exe
            packages/desktop-electron/release/*.AppImage
            packages/desktop-electron/release/*.deb
            packages/desktop-electron/release/*.blockmap
            packages/desktop-electron/release/latest*.yml
          if-no-files-found: warn

  release:
    if: always() && needs.prepare.outputs.release_enabled == 'true' && needs.prepare.outputs.create_release == 'true' && needs.build.result == 'success'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-electron-*
          path: release-assets
          merge-multiple: true

      - name: Ensure release tag exists
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.release_tag }}"
          if git rev-parse --verify "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "${GITHUB_SHA}"
            git push origin "$TAG"
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | xargs -0 sha256sum > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: AgentLine Desktop Electron v${{ needs.prepare.outputs.release_version }}
          body: |
            ## AgentLine Desktop Electron v${{ needs.prepare.outputs.release_version }}

            - Version: `${{ needs.prepare.outputs.release_version }}`
            - Tag: `${{ needs.prepare.outputs.release_tag }}`
            - Commit: `${{ github.sha }}`

            Desktop Electron bundles for macOS, Windows, and Linux.
          files: |
            release-assets/*
          draft: false
          prerelease: false
