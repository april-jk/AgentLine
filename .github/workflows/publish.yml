name: Release Orchestrator

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release_any: ${{ steps.plan.outputs.should_release_any }}
      should_release_root: ${{ steps.plan.outputs.should_release_root }}
      should_release_desktop_electron: ${{ steps.plan.outputs.should_release_desktop_electron }}
      should_release_mobile_rn: ${{ steps.plan.outputs.should_release_mobile_rn }}
      should_release_bridge: ${{ steps.plan.outputs.should_release_bridge }}
      root_version: ${{ steps.plan.outputs.root_version }}
      root_tag: ${{ steps.plan.outputs.root_tag }}
      desktop_electron_version: ${{ steps.plan.outputs.desktop_electron_version }}
      mobile_rn_version: ${{ steps.plan.outputs.mobile_rn_version }}
      bridge_version: ${{ steps.plan.outputs.bridge_version }}
      should_refresh_existing_release: ${{ steps.plan.outputs.should_refresh_existing_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release plan
        id: plan
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const cp = require("node:child_process");

          const readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const existsTag = (tag) => {
            try {
              cp.execSync(`git rev-parse --verify ${tag}`, { stdio: "ignore" });
              return true;
            } catch {
              return false;
            }
          };

          const rootVersion = readJson("package.json").version;
          const desktopElectronVersion = rootVersion;
          const mobileRnVersion = rootVersion;
          const bridgeVersion = rootVersion;
          const rootTag = `v${rootVersion}`;
          const rootMissing = !existsTag(rootTag);
          const manualDispatch = process.env.GITHUB_EVENT_NAME === "workflow_dispatch";
          const shouldRefresh = manualDispatch || rootMissing;
          const out = fs.createWriteStream(process.env.GITHUB_OUTPUT, {
            flags: "a",
          });

          const write = (key, value) => out.write(`${key}=${value}\n`);

          write("root_version", rootVersion);
          write("root_tag", rootTag);
          write("desktop_electron_version", desktopElectronVersion);
          write("mobile_rn_version", mobileRnVersion);
          write("bridge_version", bridgeVersion);
          write("should_release_root", String(rootMissing));
          write("should_release_desktop_electron", String(shouldRefresh));
          write("should_release_mobile_rn", String(shouldRefresh));
          write("should_release_bridge", String(shouldRefresh));
          write("should_release_any", String(shouldRefresh));
          write("should_refresh_existing_release", String(manualDispatch && !rootMissing));
          out.end();

          const summary = [
            `Unified release tag: ${rootTag}`,
            `Desktop Electron release version: ${desktopElectronVersion}`,
            `Mobile RN release version: ${mobileRnVersion}`,
            `Devices runtime release version: ${bridgeVersion}`,
            "",
            shouldRefresh
              ? manualDispatch && !rootMissing
                ? "Manual refresh requested for an existing unified release."
                : `Unified release ${rootMissing ? "will be created" : "will be refreshed"}.`
              : "Unified release tag already exists and no refresh was requested.",
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE

  verify:
    if: needs.prepare.outputs.should_release_any == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm typecheck

      - name: Verify unified release versions
        run: pnpm version:check

      - name: Run client smoke tests
        run: pnpm --filter @agentline/client exec vitest run src/hooks/__tests__/useRecentProject.test.ts src/api/client.test.ts

      - name: Run server smoke tests
        run: pnpm --filter @agentline/server test -- security.test.ts sessions.test.ts

      - name: Build remote client
        run: pnpm --filter @agentline/client build:remote

      - name: Build relay
        run: pnpm --filter @agentline/relay build

      - name: Build desktop electron
        run: pnpm --filter @agentline/desktop-electron build

      - name: Typecheck mobile RN
        run: pnpm --filter @agentline/mobile-rn typecheck

  cleanup_legacy_component_releases:
    if: needs.prepare.outputs.should_release_any == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete legacy component releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t legacy_tags < <(
            gh release list --limit 200 --json tagName --jq '.[].tagName' | \
              grep -E '^(desktop-v|desktop-electron-v|mobile-rn-v|bridge-v)' || true
          )

          if [ "${#legacy_tags[@]}" -eq 0 ]; then
            echo "No legacy component releases found."
            exit 0
          fi

          printf 'Deleting legacy component releases:\n%s\n' "${legacy_tags[@]}"
          for tag in "${legacy_tags[@]}"; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done

  publish_root:
    if: needs.prepare.outputs.should_release_root == 'true'
    needs:
      - prepare
      - verify
      - cleanup_legacy_component_releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Verify changelog has root version entry
        run: |
          VERSION="${{ needs.prepare.outputs.root_version }}"
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing version ${VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundle for npm
        run: pnpm build:bundle
        env:
          NPM_VERSION: ${{ needs.prepare.outputs.root_version }}

      - name: Pack npm artifact
        id: pack
        shell: bash
        run: |
          cd dist/npm-package
          npm pack --json > /tmp/npm-pack.json
          PACKAGE_TARBALL=$(node -e "const data = JSON.parse(require('node:fs').readFileSync('/tmp/npm-pack.json', 'utf8')); console.log(data[0].filename)")
          sha256sum "$PACKAGE_TARBALL" > checksums-sha256.txt
          echo "tarball=${PACKAGE_TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Try publishing to npm
        id: npm_publish
        shell: bash
        run: |
          cd dist/npm-package
          set +e
          npm publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "summary=Published to npm successfully." >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            summary=$(tail -n 20 /tmp/npm-publish.log | tr '\n' ' ' | sed 's/[[:space:]]\\+/ /g')
            echo "summary=${summary}" >> "$GITHUB_OUTPUT"
            echo "npm publish failed; continuing GitHub release flow."
          fi
          exit 0

      - name: Extract changelog for release notes
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.root_version }}"
          awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" CHANGELOG.md > /tmp/release-notes.md

      - name: Create release body
        shell: bash
        run: |
          if [ "${{ steps.npm_publish.outputs.published }}" = "true" ]; then
            NPM_STATUS="succeeded"
          else
            NPM_STATUS="not published"
          fi

          {
            echo "## AgentLine v${{ needs.prepare.outputs.root_version }}"
            echo
            echo "- Version: \`${{ needs.prepare.outputs.root_version }}\`"
            echo "- Tag: \`${{ needs.prepare.outputs.root_tag }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- npm publish: \`${NPM_STATUS}\`"
            echo
            echo "### Unified Release Components"
            echo
            echo "- Desktop app (Electron): \`${{ needs.prepare.outputs.desktop_electron_version }}\`"
            echo "- Mobile app (React Native): \`${{ needs.prepare.outputs.mobile_rn_version }}\`"
            echo "- Devices runtime: \`${{ needs.prepare.outputs.bridge_version }}\`"
            echo "- Desktop (Tauri): deprecated and excluded from the main release bundle"
            echo
            if [ "${{ steps.npm_publish.outputs.published }}" != "true" ]; then
              echo "> npm publish did not complete during this run."
              echo "> Reason: ${{ steps.npm_publish.outputs.summary }}"
              echo
            fi
            cat /tmp/release-notes.md
          } > /tmp/release-body.md

      - name: Create and push root tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.prepare.outputs.root_tag }}" "${GITHUB_SHA}"
          git push origin "${{ needs.prepare.outputs.root_tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.root_tag }}
          name: AgentLine v${{ needs.prepare.outputs.root_version }}
          body_path: /tmp/release-body.md
          files: |
            dist/npm-package/${{ steps.pack.outputs.tarball }}
            dist/npm-package/checksums-sha256.txt
          draft: false
          prerelease: false
          make_latest: true

  release-desktop-electron:
    if: always() && needs.prepare.outputs.should_release_desktop_electron == 'true' && (needs.publish_root.result == 'success' || needs.publish_root.result == 'skipped')
    needs:
      - prepare
      - verify
      - publish_root
      - cleanup_legacy_component_releases
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-electron-ci.yml
    with:
      release_tag: ${{ needs.prepare.outputs.root_tag }}
      release_version: ${{ needs.prepare.outputs.root_version }}
      create_release: false
    secrets: inherit

  release-mobile-rn:
    if: always() && needs.prepare.outputs.should_release_mobile_rn == 'true' && (needs.publish_root.result == 'success' || needs.publish_root.result == 'skipped')
    needs:
      - prepare
      - verify
      - publish_root
      - cleanup_legacy_component_releases
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-rn-ci.yml
    with:
      release_tag: ${{ needs.prepare.outputs.root_tag }}
      release_version: ${{ needs.prepare.outputs.root_version }}
      create_release: false
    secrets: inherit

  release-bridge:
    if: always() && needs.prepare.outputs.should_release_bridge == 'true' && (needs.publish_root.result == 'success' || needs.publish_root.result == 'skipped')
    needs:
      - prepare
      - verify
      - publish_root
      - cleanup_legacy_component_releases
    permissions:
      contents: write
    uses: ./.github/workflows/bridge-ci.yml
    with:
      release_tag: ${{ needs.prepare.outputs.root_tag }}
      release_version: ${{ needs.prepare.outputs.bridge_version }}
      create_release: false
    secrets: inherit

  finalize_root_release:
    if: always() && needs.prepare.outputs.should_release_any == 'true' && (needs.publish_root.result == 'success' || needs.publish_root.result == 'skipped') && needs.release-desktop-electron.result == 'success' && needs.release-mobile-rn.result == 'success' && needs.release-bridge.result == 'success'
    needs:
      - prepare
      - publish_root
      - cleanup_legacy_component_releases
      - release-desktop-electron
      - release-mobile-rn
      - release-bridge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-electron-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-rn-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: device-bridge-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: agentline-device-server-apk
          path: release-assets

      - name: Generate app asset checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > app-assets-checksums-sha256.txt

      - name: Create unified release body
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.root_version }}"
          awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" CHANGELOG.md > /tmp/release-notes.md

          {
            echo "## AgentLine v${VERSION}"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Tag: \`${{ needs.prepare.outputs.root_tag }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "### App Bundles"
            echo
            echo "- Desktop app: Electron"
            echo "- Mobile app: React Native"
            echo "- Desktop (Tauri): deprecated and not published in this unified release"
            echo
            echo "### Unified Release Components"
            echo
            echo "- Desktop app (Electron): \`${{ needs.prepare.outputs.desktop_electron_version }}\`"
            echo "- Mobile app (React Native): \`${{ needs.prepare.outputs.mobile_rn_version }}\`"
            echo "- Devices runtime: \`${{ needs.prepare.outputs.bridge_version }}\`"
            echo
            cat /tmp/release-notes.md
          } > /tmp/unified-release-body.md

      - name: Upload unified app assets to root release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.root_tag }}
          name: AgentLine v${{ needs.prepare.outputs.root_version }}
          body_path: /tmp/unified-release-body.md
          files: |
            release-assets/*
          draft: false
          prerelease: false
          make_latest: true
