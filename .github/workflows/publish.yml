name: Release from main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists; skipping publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Preparing release ${TAG} from ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify changelog has entry for version
        if: steps.release.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md does not contain an entry for version ${VERSION}"
            echo "Please add a '## [${VERSION}]' section to CHANGELOG.md before releasing."
            exit 1
          fi
          echo "Changelog entry found for version ${VERSION}"

      - name: Install dependencies
        if: steps.release.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run linter
        if: steps.release.outputs.should_release == 'true'
        run: pnpm lint

      - name: Run type checking
        if: steps.release.outputs.should_release == 'true'
        run: pnpm typecheck

      - name: Run tests
        if: steps.release.outputs.should_release == 'true'
        run: pnpm test

      - name: Build bundle for npm
        if: steps.release.outputs.should_release == 'true'
        run: pnpm build:bundle
        env:
          NPM_VERSION: ${{ steps.release.outputs.version }}

      - name: Pack npm artifact
        if: steps.release.outputs.should_release == 'true'
        id: pack
        shell: bash
        run: |
          cd dist/npm-package
          npm pack --json > /tmp/npm-pack.json
          PACKAGE_TARBALL=$(node -e "const data = JSON.parse(require('node:fs').readFileSync('/tmp/npm-pack.json', 'utf8')); console.log(data[0].filename)")
          sha256sum "$PACKAGE_TARBALL" > checksums-sha256.txt
          echo "tarball=${PACKAGE_TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        if: steps.release.outputs.should_release == 'true'
        run: |
          cd dist/npm-package
          npm pack --dry-run
          echo "Package contents verified"

      - name: Publish to npm
        if: steps.release.outputs.should_release == 'true'
        run: |
          cd dist/npm-package
          npm publish --provenance --access public

      - name: Extract changelog for release notes
        if: steps.release.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{found=0} found" CHANGELOG.md > /tmp/release-notes.md
          echo "Release notes for $VERSION:"
          cat /tmp/release-notes.md

      - name: Create release body
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          {
            echo "## AgentLine v${{ steps.release.outputs.version }}"
            echo
            echo "- Version: \`${{ steps.release.outputs.version }}\`"
            echo "- Tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            cat /tmp/release-notes.md
          } > /tmp/release-body.md

      - name: Create and push release tag
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.tag }}" "${GITHUB_SHA}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: AgentLine v${{ steps.release.outputs.version }}
          body_path: /tmp/release-body.md
          files: |
            dist/npm-package/${{ steps.pack.outputs.tarball }}
            dist/npm-package/checksums-sha256.txt
          draft: false
          prerelease: false
